name: Build OpenWrt IPKs

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_url: "https://downloads.openwrt.org/snapshots/targets/bcm4908/generic/openwrt-sdk-bcm4908-generic_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
            pkgarch: aarch64_cortex-a53
          - sdk_url: "https://downloads.openwrt.org/snapshots/targets/sunxi/cortexa7/openwrt-sdk-sunxi-cortexa7_gcc-14.4.0_musl_eabi.Linux-x86_64.tar.zst"
            pkgarch: arm_cortex-a7_neon-vfpv4
          - sdk_url: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkgarch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download OpenWrt SDK
        run: |
          wget -q --timeout=180 "${{ matrix.sdk_url }}" -O sdk.tar.zst
          ls -la sdk.tar.zst

      - name: Extract SDK
        run: |
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
          ls sdk/

      - name: Add luci-app-aether feed
        run: |
          mkdir -p sdk/feeds/custom/aether
          rsync -a --exclude='sdk/' --exclude='.git/' ./ sdk/feeds/custom/aether/
          cd sdk
          ./scripts/feeds update custom
          ./scripts/feeds install -a -p custom

      - name: Enable package
        run: |
          cd sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-aether=y" >> .config
          make oldconfig

      - name: Build
        run: |
          cd sdk
          make package/luci-app-aether/compile V=s

      - name: Collect IPK
        run: |
          mkdir -p artifacts
          find sdk/bin -name "luci-app-aether_*.ipk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.pkgarch }}
          path: artifacts/*.ipk
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate repo index
        run: |
          cd artifacts
          bash ../gen-repo.sh .

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.ipk
            artifacts/Packages
            artifacts/Packages.gz
            artifacts/SHA256SUMS.txt